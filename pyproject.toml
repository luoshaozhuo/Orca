[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orca-plant-control"
version = "0.1.0"
description = "Orca renewable power plant coordinated control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "redis>=5,<7", "grpcio>=1.81.1,<2", "protobuf>=6.33.5,<7"]

[project.scripts]
orca = "cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/algorithms", "src/control", "src/commissioning", "src/evaluation", "src/optimization", "src/infrastructure", "src/cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: collaboration of actual components and services",
    "real_service: requires a real local software service",
    "mock_service: uses a simulated network service",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "google.protobuf", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "infrastructure.wind_hub.rpc.collector_pb2",
    "infrastructure.wind_hub.rpc.collector_pb2_grpc",
    "infrastructure.wind_hub.rpc.commander_pb2",
    "infrastructure.wind_hub.rpc.commander_pb2_grpc",
]
ignore_errors = true

# pb2 消息类由 protobuf builder 在运行时生成，静态分析不可见。
[[tool.mypy.overrides]]
module = ["infrastructure.wind_hub.commander", "infrastructure.wind_hub.collector"]
disable_error_code = ["attr-defined"]
