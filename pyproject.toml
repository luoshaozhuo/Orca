[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orca-plant-control"
version = "0.1.0"
description = "Orca renewable power plant coordinated control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "redis>=5,<7", "grpcio>=1.81,<2", "protobuf>=6.33,<7"]

[project.scripts]
orca = "cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/algorithms", "src/control", "src/commissioning", "src/evaluation", "src/optimization", "src/infrastructure", "src/cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
