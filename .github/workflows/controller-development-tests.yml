name: Controller development tests
on:
  push:
    branches:
      - feat/controller-v0-11-coordination
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tooling
        run: python -m pip install -e ".[dev]"
      - name: Syntax compilation
        run: python -m compileall -q src tests
      - name: Targeted controller unit tests
        run: |
          python -m pytest -q tests/test_control_laws.py tests/test_control_pipeline.py tests/test_control_pipeline_factory.py tests/test_control_coordinator.py tests/test_coordination_config.py tests/test_power_allocator.py tests/test_device_capability.py tests/test_joint_power_allocator.py tests/test_joint_plant_allocator.py tests/test_active_power_planner.py tests/test_active_power_controller.py tests/test_active_power_reference.py tests/test_redis_planning_snapshot.py tests/test_runtime_planning.py tests/test_runtime_planning_config.py tests/test_read_only_planning_cycle.py tests/test_application_planning.py tests/test_control_runtime_state.py
      - name: Full repository pytest regression
        run: python -m pytest -q tests
