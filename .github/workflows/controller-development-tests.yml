name: Controller development tests

on:
  push:
    branches:
      - main
      - refactor/controller-v011-production-quality
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tooling
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src
      - name: Syntax compilation
        run: python -m compileall -q src tests

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tooling
        run: python -m pip install -e ".[dev]"
      - name: Unit tests with coverage
        run: python -m pytest -q tests/unit --cov=src --cov-report=term-missing

  integration-system-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tooling
        run: python -m pip install -e ".[dev]"
      - name: Start managed Redis
        env:
          REDIS_BIND_IP: 127.0.0.1
        run: bash scripts/start_redis.sh
      - name: Integration tests (real Redis + mock gRPC)
        run: python -m pytest -q tests/integration
      - name: System tests (full P/Q dispatch chain)
        run: python -m pytest -q tests/system
      - name: Reliability tests (failure injection + soak smoke)
        run: python -m pytest -q tests/reliability
